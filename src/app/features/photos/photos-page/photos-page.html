<div class="grid">
    @for (photo of photos(); track photo.id) {
    <mat-card class="card" appearance="outlined">
        <img mat-card-image [src]="photo.url" [alt]="'Photo ' + photo.id" width="200" height="300" loading="lazy" />
        <mat-card-content class="card-title">{{ photo.title }}</mat-card-content>
    </mat-card>
    }
</div>

@if (loading()) {
<div class="loader"><mat-spinner diameter="40" /></div>
} @else {
<div appInfiniteScroll (scrolled)="loadMore()"></div>
}
