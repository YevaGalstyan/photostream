<div class="search-bar">
  <div class="row">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="field">
      <mat-icon matPrefix>search</mat-icon>
      <input #box matInput type="text" placeholder="Search by name or tag"
             aria-label="Search photos"
             [value]="search.query()" (input)="search.query.set(box.value)" />
    </mat-form-field>

    <button mat-button type="button" class="unfilter" aria-label="Clear all filters"
            [disabled]="!search.hasFilters()" (click)="search.clear()">
      <mat-icon>filter_alt_off</mat-icon>
      <span class="unfilter-label">Clear</span>
    </button>
  </div>

  <div class="tags-scroll">
    <mat-chip-listbox multiple aria-label="Filter by tag" (change)="onTagsChange($event)">
      @for (tag of tags; track tag) {
        <mat-chip-option [value]="tag" [selected]="search.tags().includes(tag)">{{ tag }}</mat-chip-option>
      }
    </mat-chip-listbox>
  </div>
</div>
